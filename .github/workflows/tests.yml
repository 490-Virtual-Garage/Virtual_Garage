name: Knowledge Base Tests

on:
  push:
    branches:
      - main
      - backend
    paths:
      - "rule_engine/**"
      - "obd_backend/requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - main
      - backend
    paths:
      - "rule_engine/**"
      - "obd_backend/requirements.txt"
      - ".github/workflows/tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:2026
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: testpassword
      NEO4J_DATABASE: neo4j

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r obd_backend/requirements.txt pytest

      - name: Seed Neo4j from dtc_pid.json
        run: python -m rule_engine.neo4j_seed

      - name: Run tests
        run: python -m pytest rule_engine -v